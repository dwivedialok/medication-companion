# Disabled: this workflow authenticated to GCP via WIF and ran live/integration
# tests that need Vertex / Gemini. GitHub CI intentionally has no such secrets
# for now. Offline coverage lives in .github/workflows/ci.yml (unit tests,
# Flutter analyze/test, shellcheck). Re-enable when WIF + Vertex CI secrets
# are provisioned; until then live tests stay local/staging-only
# (`pytest -m live`, docs/smoke_test_cheatsheet.md).

name: PR Checks

on:
  # workflow_dispatch only — keep the file for a future WIF-backed re-enable
  # without firing on every PR (ci.yml already covers PRs to main).
  workflow_dispatch:

jobs:
  skipped:
    runs-on: ubuntu-latest
    steps:
      - name: Explain
        run: |
          echo "PR Checks (WIF + live/integration) are disabled."
          echo "Use CI workflow for offline unit tests."
