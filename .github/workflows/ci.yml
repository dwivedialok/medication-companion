name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  test-backend:
    name: Backend — tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Install dependencies
        # Deps live in repo-root pyproject.toml + uv.lock (no backend/requirements.txt).
        run: uv sync --locked

      - name: Run unit tests
        env:
          MEMORY_BACKEND: local
          ENVIRONMENT: development
          GEMINI_MODEL: gemini-3.5-flash
          # Offline only — no Gemini / Vertex secrets in GitHub Actions.
          # Live integration tests (tests/integration, pytest -m live) run locally
          # or in staging with ADC; see docs/smoke_test_cheatsheet.md.
        run: uv run pytest tests/unit -v --tb=short

  test-frontend:
    name: Frontend — Flutter analyze + test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable

      - name: Install dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Analyze
        working-directory: frontend
        run: flutter analyze

      - name: Test
        working-directory: frontend
        run: flutter test

  shellcheck:
    name: Shell scripts — shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: ShellCheck
        run: |
          shellcheck scripts/setup_gcp.sh
          shellcheck scripts/teardown_gcp.sh
          shellcheck deploy/auth_broker/deploy.sh
          shellcheck scripts/grant_firebase_hosting_invoker.sh

  # NOTE: GCP deployment is handled by .github/workflows/staging.yaml (push to
  # main → staging → prod). The legacy `deploy` job that ran deploy/deploy.sh
  # has been removed; that script is deprecated (see docs/deployment_runbook.md).
