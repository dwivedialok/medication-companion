name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  test-backend:
    name: Backend — lint, type-check, tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        working-directory: backend
        run: ruff check .

      - name: Type check (mypy)
        working-directory: backend
        run: mypy . --ignore-missing-imports --exclude tests/

      - name: Run tests
        working-directory: backend
        env:
          MEMORY_BACKEND: local
          ENVIRONMENT: development
          GEMINI_MODEL: gemini-3.5-flash
          # Tests use InMemorySessionService — no GCP credentials needed
        run: pytest tests/ -v --tb=short

  test-frontend:
    name: Frontend — Flutter analyze + test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable

      - name: Install dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Analyze
        working-directory: frontend
        run: flutter analyze

      - name: Test
        working-directory: frontend
        run: flutter test

  shellcheck:
    name: Shell scripts — shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: ShellCheck
        run: |
          shellcheck scripts/setup_gcp.sh
          shellcheck scripts/teardown_gcp.sh
          shellcheck deploy/auth_broker/deploy.sh
          shellcheck scripts/grant_firebase_hosting_invoker.sh

  # NOTE: GCP deployment is handled by .github/workflows/staging.yaml (push to
  # main → staging → prod). The legacy `deploy` job that ran deploy/deploy.sh
  # has been removed; that script is deprecated (see docs/deployment_runbook.md).
