name: medication_companion
description: AI-powered prescription analysis for patients in India.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^3.13.1
  firebase_auth: ^5.5.1

  # Networking
  http: ^1.3.0

  # Camera / gallery picker
  image_picker: ^1.1.2

  # Audio playback
  audioplayers: ^6.4.0

  # State management
  provider: ^6.1.2

  # Navigation
  go_router: ^14.6.2

  # Date formatting
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
